[build]
  # Setzt die Datenbank-Variablen zurecht, spielt die Prisma-Migrationen ein
  # und baut danach Next.js. Details siehe scripts/netlify-build.sh.
  command = "bash scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PRISMA_HIDE_UPDATE_MESSAGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/e/*"
  [headers.values]
    # Gast- und Gastgeber-Links gehören nicht in Suchmaschinen, und der
    # Gastgeber-Key soll nicht als Referrer nach außen wandern.
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
